  --warn-soft: #f6e6d8;
  --ok: #2f7a4f;
  --font-display: "Suez One", "Assistant", Georgia, serif;
  --font-body: "Assistant", "Segoe UI", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #161b19; --card: #1f2522; --fg: #e8ece7; --muted: #a3ada7; --line: #333c37;
  --accent: #c7a6d6; --accent-soft: #2e2533; --mat: #8fc7ae; --mat-soft: #1f322b;
  --warn: #f0a46c; --warn-soft: #3a2a1d; --ok: #7cc39c; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #161b19; --card: #1f2522; --fg: #e8ece7; --muted: #a3ada7; --line: #333c37;
  --accent: #c7a6d6; --accent-soft: #2e2533; --mat: #8fc7ae; --mat-soft: #1f322b;

.sheet-bg { position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,.4); display: flex; align-items: flex-end; justify-content: center }

  display: flex; flex-direction: column; gap: 12px }

.class-mode { position: fixed; inset: 0; z-index: 50; background: var(--bg); overflow: auto; overscroll-behavior: contain;
  padding: calc(14px + env(safe-area-inset-top, 0px)) max(18px, env(safe-area-inset-right, 0px)) calc(30px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px)) }
.class-mode .cm-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 10px; flex-wrap: wrap }
.class-mode .cm-sec { font-family: var(--font-display); font-size: 24px; margin: 18px 0 6px; color: var(--tone) }

<script>
/* ===== Boot: get the content, then start the app.
   Here and inside Claude: plain data.js. On the public site (github.io): only data.enc exists,
   encrypted with Shai's entry code (made by tools\lock-data.ps1). The code is remembered on her phone. ===== */
(function () {
  const PUBLIC = /github\.io$/.test(location.hostname) || /[?&]lock\b/.test(location.search);
  const addScript = text => { const s = document.createElement("script"); s.textContent = text; document.body.appendChild(s); };
  const startApp = () => { document.body.classList.remove("locked"); addScript(document.getElementById("app-code").textContent); };
  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  async function unlock(code) {
    const res = await fetch("data.enc", { cache: "no-cache" });
    if (!res.ok) throw new Error("missing");
    const f = await res.json(), iv = b64(f.iv), ct = b64(f.ct);
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(code.normalize("NFC").trim()), "PBKDF2", false, ["deriveBits"]);
    const bits = new Uint8Array(await crypto.subtle.deriveBits({ name: "PBKDF2", hash: "SHA-256", salt: b64(f.salt), iterations: f.it }, base, 512));
    const macKey = await crypto.subtle.importKey("raw", bits.slice(32), { name: "HMAC", hash: "SHA-256" }, false, ["verify"]);
    const signed = new Uint8Array(iv.length + ct.length); signed.set(iv); signed.set(ct, iv.length);
    if (!(await crypto.subtle.verify("HMAC", macKey, b64(f.mac), signed))) throw new Error("wrong");
    const encKey = await crypto.subtle.importKey("raw", bits.slice(0, 32), "AES-CBC", false, ["decrypt"]);
    return new TextDecoder().decode(await crypto.subtle.decrypt({ name: "AES-CBC", iv }, encKey, ct));
  }
  const mem = { get() { try { return localStorage.getItem("shai_code"); } catch (e) { return null; } },
                set(v) { try { v ? localStorage.setItem("shai_code", v) : localStorage.removeItem("shai_code"); } catch (e) {} } };
  function lockScreen(msg) {
    document.body.classList.add("locked");
    document.getElementById("main").innerHTML = `<form class="lock" id="lock-form">
      <h2>ברוכה הבאה</h2>
      <p>מקלידים את קוד הכניסה פעם אחת, והטלפון יזכור אותו.</p>
      <label for="lock-code" class="sr-only">קוד כניסה</label>
      <input class="inp" id="lock-code" type="password" autocomplete="current-password" placeholder="קוד כניסה" required>
      <button class="btn wide" type="submit">כניסה</button>
      <div class="err" role="alert">${msg || ""}</div></form>`;
    const form = document.getElementById("lock-form");
    form.addEventListener("submit", async e => {
      e.preventDefault();
      const code = document.getElementById("lock-code").value, btn = form.querySelector("button"), err = form.querySelector(".err");
      btn.disabled = true; btn.textContent = "פותח..."; err.textContent = "";
      try { const text = await unlock(code); mem.set(code); addScript(text); startApp(); }
      catch (x) { btn.disabled = false; btn.textContent = "כניסה"; err.textContent = x.message === "wrong" ? "הקוד לא נכון. נסי שוב." : "אין חיבור לאינטרנט. נסי שוב בעוד רגע."; }
    });
  }
  async function viaCode() {
    const code = mem.get();
    if (code) {
      try { addScript(await unlock(code)); startApp(); return; }
      catch (x) { if (x.message === "wrong") mem.set(null); return lockScreen(x.message === "wrong" ? "" : "אין חיבור לאינטרנט. נסי שוב בעוד רגע."); }
    }
    lockScreen();
  }
  if (PUBLIC) { viaCode(); return; }
  const s = document.createElement("script"); s.src = "data.js"; s.onload = startApp; s.onerror = viaCode; document.body.appendChild(s);
})();
</script>
<script id="app-code" type="text/plain">
/* ===== Storage: everything Shai creates lives on this device (localStorage + IndexedDB for videos) ===== */
const store = { get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
                set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } } };
const DB = Object.assign({ v: 1, plans: [], ex: {}, log: {} }, store.get("shai_db", {}));
const BUILTIN_EX = new Set(Object.keys(EX));
Object.assign(EX, DB.ex);
function save() {
  if (!store.set("shai_db", DB)) toast("השמירה נכשלה. אולי הזיכרון בטלפון מלא.");
  const b = store.get("shai_bk", {}); if (!b.dirty) store.set("shai_bk", { at: b.at || Date.now(), dirty: true });
}
/* Backup reminder: "at" = last backup (or first change), "dirty" = changed since then. Shown after 14 days, "later" hides it for 3 days. */
const BK_DAYS = 14;
function markBackedUp() { store.set("shai_bk", { at: Date.now(), dirty: false }); store.set("shai_bk_snooze", 0); }
function needsBackup() {
  const b = store.get("shai_bk", {});
  return !!(b.dirty && b.at && Date.now() - b.at > BK_DAYS * 864e5 && Date.now() > (store.get("shai_bk_snooze", 0) || 0));
}
try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}

const VID = {
  db: null,
  open() { if (this.db) return Promise.resolve(this.db); return new Promise((res, rej) => { try { const r = indexedDB.open("shai-videos", 1);
    r.onupgradeneeded = () => r.result.createObjectStore("v"); r.onsuccess = () => { this.db = r.result; res(this.db); }; r.onerror = () => rej(r.error); } catch (e) { rej(e); } }); },
  async tx(mode, fn) { const db = await this.open(); return new Promise((res, rej) => { const t = db.transaction("v", mode); const req = fn(t.objectStore("v")); t.oncomplete = () => res(req && req.result); t.onerror = () => rej(t.error); }); },
  get(id) { return this.tx("readonly", s => s.get(id)); },
  put(id, blob) { return this.tx("readwrite", s => s.put(blob, id)); },
  del(id) { return this.tx("readwrite", s => s.delete(id)); },
  keys() { return this.tx("readonly", s => s.getAllKeys()); },
};
let videoIds = new Set();
VID.keys().then(k => { videoIds = new Set(k || []); if (S.tab === "lib") render(); }).catch(() => {});

/* ===== State ===== */
const S = { mode: store.get("shai_mode", "barre"), tab: "plans", plan: null, edit: null, today: store.get("shai_today", []), q: "", area: "", sort: store.get("shai_sort", "default"), confirm: null };
const main = document.getElementById("main");
const overlay = document.getElementById("overlay");
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const safeUrl = u => { try { const x = new URL(u); return x.protocol === "https:" ? x.href : ""; } catch (e) { return ""; } };
const allPlans = () => [...DB.plans, ...PLANS];
const findPlan = id => allPlans().find(p => p.id === id);
const isMine = p => !!(p && p.own);
const AREAS = ["חימום","בטן","ישבן","רגליים","גב","ידיים וכתפיים","גמישות"];
const GEAR = ["כדור קטן","גומייה","משקולות","טבעת","בר","בלוק או כרית","כיסא"];
const todayISO = () => new Date().toISOString().slice(0, 10);
const ON_OWN_SITE = /^(localhost|127\.0\.0\.1)$|github\.io$/.test(location.hostname);

function toast(msg) {
  const w = document.getElementById("toast-wrap");
  w.innerHTML = `<div class="toast">${esc(msg)}</div>`;
  clearTimeout(toast.t); toast.t = setTimeout(() => { w.innerHTML = ""; }, 2600);
}
function daysAgo(iso) { const d = Math.round((new Date(todayISO()) - new Date(iso)) / 864e5); return d <= 0 ? "היום" : d === 1 ? "אתמול" : `לפני ${d} ימים`; }
function lastTaught(id) { const l = DB.log[id]; return l && l.length ? l[l.length - 1] : null; }

/* ===== Small pieces ===== */
function alertsFor(ex) { return S.today.filter(p => ex.x && ex.x[p]).map(p => `<div class="alert"><b>${POP[p]}:</b> ${esc(ex.x[p])}</div>`).join(""); }
function todayBox() {
  return `<div class="today"><b>יש היום בשיעור:</b>
    <div class="chips">${Object.entries(POP).map(([k, v]) => `<button type="button" class="chip" data-a="today" data-id="${k}" aria-pressed="${S.today.includes(k)}">${v}</button>`).join("")}</div>
    <span class="hint">בוחרים, ובכל תרגיל שצריך התאמה תופיע הערה עם החלופה.</span></div>`;
}
function planWarnCount(p) {
  if (!S.today.length) return 0;
  let n = 0; p.s.forEach(sec => sec[2].forEach(([id]) => { const ex = EX[id]; if (ex && S.today.some(k => ex.x && ex.x[k])) n++; }));
  return n;
}
const planMins = p => p.s.reduce((a, s) => a + (Number(s[1]) || 0), 0);
function planCard(p) {
  const w = planWarnCount(p); const last = lastTaught(p.id);
  return `<button type="button" class="plan-card ${isMine(p) ? "mine" : ""}" data-a="plan" data-id="${esc(p.id)}"><span class="t">${esc(p.n)}</span>${p.d ? `<span class="d">${esc(p.d)}</span>` : ""}
    <span class="meta"><span class="tag">${planMins(p)} דק׳</span>${(p.tags || []).map(t => `<span class="tag">${esc(t)}</span>`).join("")}
    <span class="tag last">${last ? "הועבר " + daysAgo(last) : "עוד לא הועבר"}</span>${w ? `<span class="tag w">${w} תרגילים צריכים התאמה</span>` : ""}</span></button>`;
}
function itemRow(id, dose) {
  const ex = EX[id]; if (!ex) return `<div class="item"><span class="nm">תרגיל שנמחק</span></div>`;
  return `<button type="button" class="item" data-a="ex" data-id="${esc(id)}"><span class="top"><span class="nm">${esc(ex.n)}${videoIds.has(id) ? '<span class="vid-badge">▶ סרטון</span>' : ""}</span><span class="ds">${esc(dose || "")}</span></span>${alertsFor(ex)}</button>`;
}

/* ===== Plans ===== */
function sortPlans(list) {
  if (S.sort !== "oldest") return list;
  return [...list].sort((a, b) => (lastTaught(a.id) || "0000") .localeCompare(lastTaught(b.id) || "0000"));
}
function viewPlans() {
  if (S.edit) return viewEdit(findPlan(S.edit));
  if (S.plan) return viewPlan(findPlan(S.plan));
  const mine = sortPlans(DB.plans.filter(p => p.t === S.mode));
  const ready = sortPlans(PLANS.filter(p => p.t === S.mode));
  const lead = S.mode === "barre" ? "מערכים מגוונים, עם דגש על העבודה ליד הבר. כל מערך בנוי ל־50–55 דקות." : "מערכים לשיעור מזרון. בכל תרגיל יש גרסה קלה וקשה, והתאמות למקרים מיוחדים.";
  return `${todayBox()}
  <div class="chips" role="group" aria-label="סדר"><button type="button" class="chip f" data-a="sort" data-id="default" aria-pressed="${S.sort !== "oldest"}">סדר רגיל</button><button type="button" class="chip f" data-a="sort" data-id="oldest" aria-pressed="${S.sort === "oldest"}">מה שלא עשיתי הכי הרבה זמן</button></div>
  <div class="list-head"><h2>המערכים שלי</h2><button type="button" class="btn ghost" data-a="new-plan">+ מערך חדש</button></div>
  ${mine.length ? `<div class="plans">${mine.map(planCard).join("")}</div>` : `<div class="empty">עוד אין מערכים משלך. אפשר ללחוץ "מערך חדש", או לפתוח מערך מוכן וללחוץ "שכפול ועריכה".</div>`}
  <h2>${S.mode === "barre" ? "מערכי בר מוכנים" : "מערכי מזרון מוכנים"}</h2><p class="lead">${lead}</p>
  <div class="plans">${ready.map(planCard).join("")}</div>`;
}
function viewPlan(p) {
  if (!p) { S.plan = null; return viewPlans(); }
  const last = lastTaught(p.id); const taughtToday = last === todayISO(); const times = (DB.log[p.id] || []).length;
  const sp = safeUrl(p.sp || "");
  return `<div class="plan-view"><button type="button" class="back" data-a="back">→ כל המערכים</button>
  <div class="plan-head"><h2>${esc(p.n)}</h2><p class="lead">${p.d ? esc(p.d) + " · " : ""}${planMins(p)} דקות${isMine(p) ? " · מערך שלך" : ""}</p>
  <p class="lead">${last ? `הועבר ${daysAgo(last)} · ${times} ${times === 1 ? "פעם" : "פעמים"} בסך הכול` : "עוד לא הועבר"}</p>
  <div class="row">
    <button type="button" class="btn" data-a="class">מצב שיעור</button>
    <button type="button" class="btn ${taughtToday ? "done" : "ghost"}" data-a="taught">${taughtToday ? "✓ הועבר היום" : "העברתי היום"}</button>
    ${isMine(p) ? `<button type="button" class="btn ghost" data-a="edit">עריכה</button>` : `<button type="button" class="btn ghost" data-a="dup">שכפול ועריכה</button>`}
    ${sp ? `<a class="btn ghost" href="${esc(sp)}" target="_blank" rel="noopener">פלייליסט ↗</a>` : ""}
  </div></div>
  ${todayBox()}
  ${p.s.map(([name, m, items]) => `<div class="sec"><div class="sec-h">${esc(name)}<span>${esc(m)} דק׳</span></div>${items.map(([id, d]) => itemRow(id, d)).join("") || `<div class="item"><span class="hint">אין עדיין תרגילים בחלק הזה</span></div>`}</div>`).join("")}
  <p class="lead">לוחצים על תרגיל כדי לראות הסבר, גרסאות, התאמות וסרטון.</p></div>`;
}

/* ===== Edit a plan (only Shai's own) ===== */
function viewEdit(p) {
  if (!p || !isMine(p)) { S.edit = null; return viewPlans(); }
  const c = S.confirm === "del-plan";
  return `<div class="plan-view"><button type="button" class="back" data-a="end-edit">→ סיום עריכה</button>
  <h2 style="margin:0">עריכת מערך</h2>
  <p class="note-local">כל שינוי נשמר מיד, במכשיר הזה.</p>
  <div class="field"><label for="f-name">שם המערך</label><input class="inp" id="f-name" data-f="n" value="${esc(p.n)}"></div>
  <div class="field"><label for="f-desc">כמה מילים על המערך</label><input class="inp" id="f-desc" data-f="d" value="${esc(p.d || "")}" placeholder="למשל: ישבן בפוקוס, עם גומייה"></div>
  <div class="field"><label for="f-sp">קישור לפלייליסט בספוטיפיי</label><input class="inp" id="f-sp" data-f="sp" value="${esc(p.sp || "")}" placeholder="https://open.spotify.com/..." inputmode="url" dir="ltr"></div>
  ${p.s.map((sec, si) => `<div class="sec-edit">
    <div class="sec-row"><input class="inp" id="f-sec-${si}" data-f="sec-name" data-si="${si}" value="${esc(sec[0])}" aria-label="שם החלק">
      <input class="inp" id="f-min-${si}" data-f="sec-min" data-si="${si}" value="${esc(sec[1])}" inputmode="numeric" aria-label="דקות">
      <button type="button" class="icon-btn" data-a="sec-del" data-si="${si}" aria-label="מחיקת החלק">✕</button></div>
    ${sec[2].map(([id, d], ii) => { const ex = EX[id];
      return `<div class="ed-item"><button type="button" class="nm" data-a="ex" data-id="${esc(id)}">${ex ? esc(ex.n) : "תרגיל שנמחק"}</button>${ex ? alertsFor(ex) : ""}
      <div class="ctl"><input class="inp" id="f-dose-${si}-${ii}" data-f="dose" data-si="${si}" data-ii="${ii}" value="${esc(d || "")}" placeholder="חזרות / זמן" aria-label="חזרות או זמן">
        <button type="button" class="icon-btn" data-a="up" data-si="${si}" data-ii="${ii}" aria-label="למעלה" ${ii === 0 ? "disabled" : ""}>↑</button>
        <button type="button" class="icon-btn" data-a="down" data-si="${si}" data-ii="${ii}" aria-label="למטה" ${ii === sec[2].length - 1 ? "disabled" : ""}>↓</button>
        <button type="button" class="icon-btn" data-a="swap" data-si="${si}" data-ii="${ii}" aria-label="החלפה בתרגיל אחר">⇄</button>
        <button type="button" class="icon-btn" data-a="item-del" data-si="${si}" data-ii="${ii}" aria-label="הסרה">✕</button></div></div>`; }).join("")}
    <button type="button" class="btn ghost" data-a="add-item" data-si="${si}">+ תרגיל</button>
  </div>`).join("")}
  <button type="button" class="btn ghost wide" data-a="add-sec">+ חלק חדש בשיעור</button>
  ${todayBox()}
  ${c ? `<div class="confirm"><b>למחוק את המערך "${esc(p.n)}"?</b><span>אי אפשר לבטל את זה.</span><div class="row"><button type="button" class="btn danger" data-a="del-plan-yes">כן, למחוק</button><button type="button" class="btn ghost" data-a="cancel">ביטול</button></div></div>`
      : `<button type="button" class="btn danger" data-a="del-plan">מחיקת המערך</button>`}
  </div>`;
}
function newPlan(from) {
  const base = from ? JSON.parse(JSON.stringify(from)) : { t: S.mode, n: "מערך חדש", d: "", tags: [], s: [["חימום", 6, []], ["חלק מרכזי", 35, []], ["מתיחות", 6, []]] };
  const p = Object.assign(base, { id: uid("u-p-"), own: true, n: from ? from.n + " (שלי)" : base.n });
  delete p.from; if (from) p.from = from.id;
  DB.plans.unshift(p); save(); return p;
}

/* ===== Library ===== */
function viewLib() {
  const q = S.q.trim();
  const list = Object.values(EX).filter(e => e.t === S.mode && (!S.area || e.a === S.area) && (!q || e.n.includes(q) || (e.en || "").toLowerCase().includes(q.toLowerCase())))
    .sort((a, b) => (b.own ? 1 : 0) - (a.own ? 1 : 0));
  return `${todayBox()}<div class="list-head"><h2>תרגילי ${S.mode === "barre" ? "בר" : "מזרון"}</h2><button type="button" class="btn ghost" data-a="new-ex">+ תרגיל משלי</button></div>
  <input class="search" id="lib-q" type="search" placeholder="חיפוש תרגיל" value="${esc(S.q)}" aria-label="חיפוש תרגיל">
  <div class="chips">${["", ...AREAS].map(a => `<button type="button" class="chip f" data-a="area" data-id="${a}" aria-pressed="${S.area === a}">${a || "הכול"}</button>`).join("")}</div>
  <span class="count">${list.length} תרגילים</span>
  <div class="lib">${list.map(e => `<div class="ex"><button type="button" class="item" data-a="ex" data-id="${esc(e.id)}"><span class="top"><span class="nm">${esc(e.n)}${e.own ? '<span class="own-badge">שלי</span>' : ""}${videoIds.has(e.id) ? '<span class="vid-badge">▶ סרטון</span>' : ""}</span><span class="ds">${esc(e.a)}${e.g && e.g.length ? " · " + esc(e.g.join(", ")) : ""}</span></span>${alertsFor(e)}</button></div>`).join("")}</div>`;
}

/* ===== Guide ===== */
function exLink(id) { const e = EX[id]; return e ? `<button type="button" class="link ${e.t}" data-a="ex" data-id="${id}">${esc(e.n)}${e.t === "barre" ? " (בר)" : ""}</button>` : ""; }
function viewGuide() {
  return `<h2>אוכלוסיות מיוחדות</h2>
  <div class="disclaimer">מידע כללי שמבוסס על המלצות מקובלות, ולא ייעוץ רפואי. מתאמנת עם מצב רפואי צריכה אישור מרופא או מפיזיותרפיסטית. ההחלטה המקצועית בשיעור היא שלך.</div>
  <div class="guide">${Object.entries(GUIDE).map(([k, g]) => `<details class="pop" ${k === "preg" ? "open" : ""}><summary>${g.title}</summary><div class="pop-body">
    <p class="lead">${esc(g.intro)}</p>
    ${g.positions ? `<h3>עמדות ותרגילים שאפשר לעשות</h3>${g.positions.map(([t, ids]) => `<div><b>${esc(t)}</b><div class="links">${ids.map(exLink).join("")}</div></div>`).join("")}` : ""}
    ${g.prefer ? `<h3>מה כן</h3><ul>${g.prefer.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : ""}
    <h3>ממה להימנע</h3><ul>${g.avoid.map(x => `<li>${esc(x)}</li>`).join("")}</ul>
    ${g.picks ? `<h3>תרגילים טובים להתחיל מהם</h3><div class="links">${g.picks.map(exLink).join("")}</div>` : ""}
    ${g.stop.length ? `<h3>מתי לעצור</h3><ul>${g.stop.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : ""}
  </div></details>`).join("")}</div>`;
}

function render() {
  document.body.className = "mode-" + S.mode;
  document.getElementById("mode-barre").setAttribute("aria-pressed", S.mode === "barre");
  document.getElementById("mode-mat").setAttribute("aria-pressed", S.mode === "mat");
  document.querySelectorAll(".tabs button").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === S.tab));
  main.innerHTML = S.tab === "plans" ? viewPlans() : S.tab === "lib" ? viewLib() : viewGuide();
  if (S.tab === "plans" && !S.plan && !S.edit && needsBackup()) main.insertAdjacentHTML("afterbegin",
    `<div class="bk-remind" role="status"><p><b>הגיע הזמן לגיבוי.</b> עברו יותר משבועיים, ויש שינויים שנשמרו רק בטלפון הזה.</p>
     <div class="row"><button type="button" class="btn" data-a="backup">גיבוי עכשיו</button><button type="button" class="btn ghost" data-a="bk-later">אחר כך</button></div></div>`);
}

/* ===== Sheets ===== */
let sheetCtx = null;     // what the open sheet is for
let objUrl = null;
function sheet(html) {
  if (objUrl) { URL.revokeObjectURL(objUrl); objUrl = null; }
  overlay.innerHTML = `<div class="sheet-bg" data-a="close-bg"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title"><button type="button" class="close" data-a="close">✕ סגירה</button>${html}</div></div>`;
  const f = overlay.querySelector(".close"); if (f) f.focus();
}
async function openEx(id, confirmDel) {
  const e = EX[id]; if (!e) return;
  sheetCtx = { kind: "ex", id };
  const lv = ["", "קל", "בינוני", "מתקדם"][e.l] || "";
  const xs = Object.entries(e.x || {}).filter(([, v]) => v);
  const hasV = videoIds.has(id);
  sheet(`<h3 id="sheet-title">${esc(e.n)}</h3><div class="en">${e.en ? esc(e.en) + " · " : ""}${e.t === "barre" ? "בר" : "מזרון"} · ${esc(e.a)}${lv ? " · " + lv : ""}${e.own ? " · תרגיל שלך" : ""}</div>
    <div class="video" id="vid-box">${hasV ? "טוען סרטון..." : "עוד אין סרטון לתרגיל הזה"}
      <div class="row" style="justify-content:center">
        <label class="btn ghost file-btn">${hasV ? "החלפת סרטון" : "הוספת סרטון"}<input type="file" accept="video/*" id="vid-in" aria-label="בחירת סרטון"></label>
        ${hasV ? `<button type="button" class="btn danger" data-a="vid-del">מחיקת הסרטון</button>` : ""}
      </div><span class="note-local">הסרטון נשמר רק בטלפון הזה.</span></div>
    ${e.c ? `<h4>איך עושים</h4><p>${esc(e.c)}</p>` : ""}
    ${e.g && e.g.length ? `<h4>ציוד</h4><p>${esc(e.g.join(", "))}</p>` : ""}
    ${e.v && e.v.length ? `<h4>גרסאות</h4><ul>${e.v.map(v => `<li>${esc(v)}</li>`).join("")}</ul>` : ""}
    ${xs.length ? `<h4>התאמות למקרים מיוחדים</h4><ul>${xs.map(([k, v]) => `<li><b>${POP[k]}:</b> ${esc(v)}</li>`).join("")}</ul>` : `<h4>התאמות</h4><p>אין הגבלה מיוחדת. בכל מקרה לפי שיקול דעתך.</p>`}
    ${e.own ? (confirmDel ? `<div class="confirm"><b>למחוק את התרגיל?</b><span>הוא יוסר גם מהמערכים שלך. אי אפשר לבטל.</span><div class="row"><button type="button" class="btn danger" data-a="ex-del-yes">כן, למחוק</button><button type="button" class="btn ghost" data-a="ex-del-no">ביטול</button></div></div>`
      : `<div class="row"><button type="button" class="btn ghost" data-a="ex-edit">עריכת התרגיל</button><button type="button" class="btn danger" data-a="ex-del">מחיקה</button></div>`) : ""}`);
  if (hasV) {
    try { const blob = await VID.get(id); const box = document.getElementById("vid-box");
      if (blob && box && sheetCtx && sheetCtx.id === id) { objUrl = URL.createObjectURL(blob); const v = document.createElement("video");
        v.src = objUrl; v.controls = true; v.playsInline = true; v.preload = "metadata"; box.firstChild.replaceWith(v); } }
    catch (err) { const box = document.getElementById("vid-box"); if (box) box.firstChild.textContent = "לא הצלחתי לטעון את הסרטון"; }
  }
}
function openExForm(id) {
  const e = id ? EX[id] : { t: S.mode, n: "", a: AREAS[1], l: 1, g: [], c: "", v: [], x: {} };
  sheetCtx = { kind: "exform", id: id || null, g: [...(e.g || [])] };
  sheet(`<h3 id="sheet-title">${id ? "עריכת תרגיל" : "תרגיל חדש"}</h3>
    <p class="note-local">יתווסף ל${(e.t || S.mode) === "barre" ? "תרגילי הבר" : "תרגילי המזרון"}.</p>
    <div class="field"><label for="x-n">שם התרגיל</label><input class="inp" id="x-n" value="${esc(e.n)}"></div>
    <div class="field"><label for="x-a">אזור בגוף</label><select class="inp" id="x-a">${AREAS.map(a => `<option ${a === e.a ? "selected" : ""}>${a}</option>`).join("")}</select></div>
    <div class="field"><label for="x-l">רמה</label><select class="inp" id="x-l">${[["1","קל"],["2","בינוני"],["3","מתקדם"]].map(([v, t]) => `<option value="${v}" ${String(e.l) === v ? "selected" : ""}>${t}</option>`).join("")}</select></div>
    <div class="field"><label>ציוד</label><div class="chips" id="x-g">${GEAR.map(g => `<button type="button" class="chip f" data-a="gear" data-id="${g}" aria-pressed="${(e.g || []).includes(g)}">${g}</button>`).join("")}</div></div>
    <div class="field"><label for="x-c">איך עושים (רשות)</label><textarea class="inp" id="x-c">${esc(e.c || "")}</textarea></div>
    <div class="field"><label for="x-v">גרסאות, אחת בכל שורה (רשות)</label><textarea class="inp" id="x-v">${esc((e.v || []).join("\n"))}</textarea></div>
    <details><summary style="cursor:pointer;font-weight:700;min-height:44px;display:flex;align-items:center">התאמות למקרים מיוחדים (רשות)</summary>
      <div style="display:flex;flex-direction:column;gap:8px;margin-top:6px">${Object.entries(POP).map(([k, v]) => `<div class="field"><label for="x-x-${k}">${v}</label><input class="inp" id="x-x-${k}" value="${esc((e.x || {})[k] || "")}" placeholder="מה עושים במקום"></div>`).join("")}</div></details>
    <button type="button" class="btn wide" data-a="ex-save">שמירה</button>`);
}
function saveExForm() {
  const n = document.getElementById("x-n").value.trim();
  if (!n) { toast("צריך לכתוב שם לתרגיל"); document.getElementById("x-n").focus(); return; }
  const id = sheetCtx.id || uid("u-e-");
  const prev = EX[id] || {};
  const x = {}; Object.keys(POP).forEach(k => { const v = document.getElementById("x-x-" + k).value.trim(); if (v) x[k] = v; });
  const ex = { id, own: true, t: prev.t || S.mode, n, en: "", a: document.getElementById("x-a").value, l: Number(document.getElementById("x-l").value),
    g: sheetCtx.g, c: document.getElementById("x-c").value.trim(), v: document.getElementById("x-v").value.split("\n").map(s => s.trim()).filter(Boolean), x };
  DB.ex[id] = ex; EX[id] = ex; save();
  toast(sheetCtx.id ? "התרגיל עודכן" : "התרגיל נוסף");
  const back = sheetCtx.after; render();
  if (back) { addToPlan(back.si, id); closeOverlay(); } else openEx(id);
}
function openPicker(si, swapIi) {
  const p = findPlan(S.edit); if (!p) return;
  sheetCtx = { kind: "pick", si, swapIi, q: "" };
  drawPicker();
}
function drawPicker() {
  const p = findPlan(S.edit); const { si, swapIi, q } = sheetCtx;
  const inPlan = new Set(p.s.flatMap(s => s[2].map(it => it[0])));
  let list = Object.values(EX).filter(e => e.t === p.t && !inPlan.has(e.id));
  let title = "הוספת תרגיל";
  if (swapIi != null) {
    const cur = EX[p.s[si][2][swapIi][0]];
    title = cur ? `במקום "${cur.n}"` : "החלפה";
    if (cur && !q) list = list.filter(e => e.a === cur.a);
  }
  if (q) list = list.filter(e => e.n.includes(q) || (e.en || "").toLowerCase().includes(q.toLowerCase()));
  // exercises that need adaptation for today's group go last; never taught ones are not tracked per exercise, so keep library order otherwise
  list.sort((a, b) => (S.today.some(k => a.x && a.x[k]) ? 1 : 0) - (S.today.some(k => b.x && b.x[k]) ? 1 : 0));
  const html = `<h3 id="sheet-title">${esc(title)}</h3>
    ${swapIi != null && !q ? `<p class="note-local">תרגילים מאותו אזור בגוף שעוד לא נמצאים במערך.${S.today.length ? " מה שצריך התאמה להיום מופיע בסוף." : ""}</p>` : ""}
    <input class="search" id="pick-q" type="search" placeholder="חיפוש בכל התרגילים" value="${esc(q)}" aria-label="חיפוש תרגיל">
    <div class="pick">${list.map(e => `<button type="button" data-a="pick" data-id="${esc(e.id)}"><span><b>${esc(e.n)}</b>${e.own ? '<span class="own-badge">שלי</span>' : ""}</span><small>${esc(e.a)}${e.g && e.g.length ? " · " + esc(e.g.join(", ")) : ""}${S.today.filter(k => e.x && e.x[k]).map(k => " · צריך התאמה ל" + POP[k]).join("")}</small></button>`).join("") || `<p class="hint">לא מצאתי תרגיל מתאים.</p>`}</div>
    <button type="button" class="btn ghost" data-a="pick-new">+ תרגיל חדש משלי</button>`;
  const box = overlay.querySelector(".sheet");
  if (box) { const qi = document.getElementById("pick-q"); const pos = qi ? qi.selectionStart : null; box.innerHTML = `<button type="button" class="close" data-a="close">✕ סגירה</button>` + html;
    if (pos != null) { const n = document.getElementById("pick-q"); n.focus(); n.setSelectionRange(pos, pos); } }
  else sheet(html);
}
function addToPlan(si, id) {
  const p = findPlan(S.edit); if (!p) return;
  p.s[si][2].push([id, ""]); save(); render();
}
function openBackup(restoreMode) {
  sheetCtx = { kind: "backup" };
  const nP = DB.plans.length, nE = Object.keys(DB.ex).length;
  const b = store.get("shai_bk", {});
  const last = b.at && !b.dirty ? `הגיבוי האחרון: ${daysAgo(new Date(b.at).toISOString().slice(0, 10))}.` : b.dirty ? "יש שינויים שעוד לא גובו." : "";
  sheet(`<h3 id="sheet-title">גיבוי</h3>
    ${last ? `<p><b>${last}</b></p>` : ""}
    <p>כל מה ששמרת (${nP} מערכים, ${nE} תרגילים משלך וסימוני "העברתי היום") נשמר <b>רק בטלפון הזה</b>. אם מוחקים את נתוני הדפדפן או מחליפים טלפון, זה נמחק.</p>
    <p class="note-local">כדאי לשמור גיבוי מדי פעם, למשל לשלוח אותו לעצמך בוואטסאפ. הסרטונים לא נכללים בגיבוי.</p>
    <div class="row"><button type="button" class="btn" data-a="bk-copy">העתקת הגיבוי</button><a class="btn ghost" id="bk-file" download="shai-studio-backup.json" href="#">שמירה כקובץ</a></div>
    <textarea class="inp" id="bk-text" readonly aria-label="טקסט הגיבוי" style="min-height:90px;font-size:12px" dir="ltr"></textarea>
    <h4>שחזור מגיבוי</h4>
    <p class="note-local">מדביקים כאן טקסט של גיבוי או בוחרים קובץ. השחזור מחליף את מה שיש עכשיו.</p>
    <textarea class="inp" id="bk-in" aria-label="הדבקת גיבוי" dir="ltr" style="font-size:12px"></textarea>
    <div class="row"><label class="btn ghost file-btn">בחירת קובץ<input type="file" accept=".json,application/json,text/plain" id="bk-filein" aria-label="בחירת קובץ גיבוי"></label>
      <button type="button" class="btn danger" data-a="bk-restore">שחזור</button></div>`);
  const json = JSON.stringify({ app: "shai-studio", saved: new Date().toISOString(), data: DB });
  document.getElementById("bk-text").value = json;
  const fileLink = document.getElementById("bk-file");
  if (ON_OWN_SITE) { fileLink.href = "data:application/json;charset=utf-8," + encodeURIComponent(json); fileLink.addEventListener("click", () => { markBackedUp(); setTimeout(render, 0); }); }
  else fileLink.remove();   // inside Claude's viewer, file saves are blocked
}
function restoreFrom(text) {
  let o; try { o = JSON.parse(text); } catch (e) { toast("זה לא נראה כמו גיבוי. צריך להדביק את כל הטקסט."); return; }
  const d = o && o.app === "shai-studio" ? o.data : null;
  if (!d || !Array.isArray(d.plans) || typeof d.ex !== "object") { toast("זה לא נראה כמו גיבוי של הסטודיו."); return; }
  Object.keys(DB.ex).forEach(k => { if (!BUILTIN_EX.has(k)) delete EX[k]; });
  DB.plans = d.plans; DB.ex = d.ex || {}; DB.log = d.log || {};
  Object.values(DB.ex).forEach(e => { e.own = true; EX[e.id] = e; });
  DB.plans.forEach(p => p.own = true);
  save(); markBackedUp(); closeOverlay(); S.plan = null; S.edit = null; render();
  toast(`שוחזרו ${DB.plans.length} מערכים ו־${Object.keys(DB.ex).length} תרגילים`);
}

let wakeLock = null;
async function openClass() {
  const p = findPlan(S.plan); if (!p) return;
  sheetCtx = { kind: "class" };
  const sp = safeUrl(p.sp || "");
  overlay.innerHTML = `<div class="class-mode" role="dialog" aria-modal="true" aria-label="מצב שיעור">
    <div class="cm-top"><button type="button" class="btn ghost" data-a="close">✕ יציאה</button>${sp ? `<a class="btn ghost" href="${esc(sp)}" target="_blank" rel="noopener">פלייליסט ↗</a>` : ""}<span class="wl" id="wl"></span></div>
    <h2 style="margin:0">${esc(p.n)}</h2>
    ${p.s.map(([name, m, items]) => `<div class="cm-sec">${esc(name)} · ${esc(m)} דק׳</div>${items.map(([id, d]) => { const e = EX[id]; return e ? `<div class="cm-it">${esc(e.n)}<small>${esc(d || "")}</small>${alertsFor(e)}</div>` : ""; }).join("")}`).join("")}
  </div>`;
  overlay.querySelector(".btn").focus();
  const wl = document.getElementById("wl");
  try { wakeLock = await navigator.wakeLock.request("screen"); wl.textContent = "המסך יישאר דלוק"; } catch (e) { wl.textContent = ""; }
}
function closeOverlay() {
  overlay.innerHTML = ""; sheetCtx = null;
  if (objUrl) { URL.revokeObjectURL(objUrl); objUrl = null; }
  if (wakeLock) { try { wakeLock.release(); } catch (e) {} wakeLock = null; }
}

/* ===== Events ===== */
document.addEventListener("click", async e => {
  const m = e.target.closest("[data-mode]");
  if (m) { S.mode = m.dataset.mode; S.plan = null; S.edit = null; S.area = ""; store.set("shai_mode", S.mode); render(); return; }
  const t = e.target.closest("[data-tab]");
  if (t) { S.tab = t.dataset.tab; S.plan = null; S.edit = null; render(); window.scrollTo(0, 0); return; }
  const a = e.target.closest("[data-a]"); if (!a) return;
  const id = a.dataset.id, si = Number(a.dataset.si), ii = Number(a.dataset.ii);
  const p = findPlan(S.edit || S.plan);
  switch (a.dataset.a) {
    case "today": S.today = S.today.includes(id) ? S.today.filter(x => x !== id) : [...S.today, id]; store.set("shai_today", S.today); render(); break;
    case "sort": S.sort = id; store.set("shai_sort", id); render(); break;
    case "plan": S.plan = id; S.confirm = null; render(); window.scrollTo(0, 0); break;
    case "back": S.plan = null; render(); break;
    case "area": S.area = id; render(); break;
    case "ex": openEx(id); break;
    case "class": openClass(); break;
    case "close": closeOverlay(); break;
    case "close-bg": if (e.target === a) closeOverlay(); break;
    case "taught": {
      const l = DB.log[p.id] = DB.log[p.id] || [];
      if (l[l.length - 1] === todayISO()) { l.pop(); toast("הסימון בוטל"); } else { l.push(todayISO()); toast("נרשם שהעברת את המערך היום"); }
      save(); render(); break; }
    case "dup": { const n = newPlan(p); S.plan = n.id; S.edit = n.id; render(); window.scrollTo(0, 0); toast("נוצר עותק שלך. אפשר לערוך."); break; }
    case "new-plan": { const n = newPlan(null); S.plan = n.id; S.edit = n.id; render(); window.scrollTo(0, 0); break; }
    case "edit": S.edit = S.plan; S.confirm = null; render(); window.scrollTo(0, 0); break;
    case "end-edit": S.edit = null; S.confirm = null; render(); window.scrollTo(0, 0); break;
    case "up": case "down": { const arr = p.s[si][2]; const j = a.dataset.a === "up" ? ii - 1 : ii + 1; [arr[ii], arr[j]] = [arr[j], arr[ii]]; save(); render(); break; }
    case "item-del": p.s[si][2].splice(ii, 1); save(); render(); break;
    case "sec-del": p.s.splice(si, 1); save(); render(); break;
    case "add-sec": p.s.push(["חלק חדש", 5, []]); save(); render(); break;
    case "add-item": openPicker(si, null); break;
    case "swap": openPicker(si, ii); break;
    case "pick": {
      const { si: s2, swapIi } = sheetCtx;
      if (swapIi != null) { p.s[s2][2][swapIi][0] = id; toast("הוחלף"); } else { p.s[s2][2].push([id, ""]); toast("נוסף למערך"); }
      save(); closeOverlay(); render(); break; }
    case "pick-new": { const after = { si: sheetCtx.si }; openExForm(null); sheetCtx.after = after; break; }
    case "del-plan": S.confirm = "del-plan"; render(); break;
    case "cancel": S.confirm = null; render(); break;
    case "del-plan-yes": DB.plans = DB.plans.filter(x => x.id !== p.id); delete DB.log[p.id]; save(); S.edit = null; S.plan = null; S.confirm = null; render(); toast("המערך נמחק"); break;
    case "new-ex": openExForm(null); break;
    case "ex-edit": openExForm(sheetCtx.id); break;
    case "gear": { const g = sheetCtx.g; const k = g.indexOf(id); k >= 0 ? g.splice(k, 1) : g.push(id); a.setAttribute("aria-pressed", k < 0); break; }
    case "ex-save": saveExForm(); break;
    case "ex-del": openEx(sheetCtx.id, true); break;
    case "ex-del-no": openEx(sheetCtx.id); break;
    case "ex-del-yes": {
      const xid = sheetCtx.id; delete DB.ex[xid]; delete EX[xid];
      DB.plans.forEach(pl => pl.s.forEach(s => { s[2] = s[2].filter(it => it[0] !== xid); }));
      try { await VID.del(xid); videoIds.delete(xid); } catch (err) {}
      save(); closeOverlay(); render(); toast("התרגיל נמחק"); break; }
    case "vid-del": { const xid = sheetCtx.id; try { await VID.del(xid); videoIds.delete(xid); toast("הסרטון נמחק"); } catch (err) { toast("לא הצלחתי למחוק"); } openEx(xid); render(); break; }
    case "backup": openBackup(); break;
    case "bk-copy": {
      const tx = document.getElementById("bk-text");
      const sel = () => { tx.focus(); tx.select(); markBackedUp(); render(); toast("סימנתי את הטקסט. לוחצים לחיצה ארוכה ו״העתק״."); };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(tx.value).then(() => { markBackedUp(); render(); toast("הגיבוי הועתק. אפשר להדביק בוואטסאפ לעצמך."); }, sel); else sel();
      break; }
    case "bk-later": store.set("shai_bk_snooze", Date.now() + 3 * 864e5); render(); break;
    case "bk-restore": {
      const v = document.getElementById("bk-in").value.trim();
      if (!v) { toast("קודם מדביקים גיבוי או בוחרים קובץ"); break; }
      if (sheetCtx.armed !== v) { sheetCtx.armed = v; a.textContent = "בטוח? זה יחליף את מה שיש. ללחוץ שוב"; break; }
      restoreFrom(v); break; }
  }
});

document.addEventListener("input", e => {
  const el = e.target;
  if (el.id === "lib-q") { S.q = el.value; const pos = el.selectionStart; render(); const i = document.getElementById("lib-q"); i.focus(); i.setSelectionRange(pos, pos); return; }
  if (el.id === "pick-q" && sheetCtx && sheetCtx.kind === "pick") { sheetCtx.q = el.value.trim(); drawPicker(); return; }
  const f = el.dataset && el.dataset.f; if (!f) return;
  const p = findPlan(S.edit); if (!p) return;
  const si = Number(el.dataset.si), ii = Number(el.dataset.ii);
  if (f === "n") p.n = el.value; else if (f === "d") p.d = el.value; else if (f === "sp") p.sp = el.value.trim();
  else if (f === "sec-name") p.s[si][0] = el.value; else if (f === "sec-min") p.s[si][1] = el.value.replace(/[^\d]/g, "");
  else if (f === "dose") p.s[si][2][ii][1] = el.value;
  clearTimeout(save.t); save.t = setTimeout(save, 300);
});

document.addEventListener("change", async e => {
  const el = e.target;
  if (el.id === "vid-in" && el.files && el.files[0] && sheetCtx) {
    const file = el.files[0], xid = sheetCtx.id;
    if (file.size > 300 * 1024 * 1024) { toast("הסרטון גדול מדי. עדיף סרטון קצר."); return; }
    toast("שומר את הסרטון...");
    try { await VID.put(xid, file); videoIds.add(xid); toast("הסרטון נשמר"); openEx(xid); render(); }
    catch (err) { toast("לא הצלחתי לשמור את הסרטון. אולי אין מקום בטלפון."); }
  }
  if (el.id === "bk-filein" && el.files && el.files[0]) {
    try { document.getElementById("bk-in").value = await el.files[0].text(); toast("הקובץ נטען. עכשיו לוחצים שחזור."); } catch (err) { toast("לא הצלחתי לקרוא את הקובץ"); }
  }
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && overlay.innerHTML) closeOverlay(); });
document.addEventListener("visibilitychange", async () => {
  if (wakeLock !== null && document.visibilityState === "visible" && document.querySelector(".class-mode")) {
    try { wakeLock = await navigator.wakeLock.request("screen"); } catch (e) {}
  }
});
if ("serviceWorker" in navigator && ON_OWN_SITE) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
render();
</script>
