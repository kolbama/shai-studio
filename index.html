<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>הסטודיו של שי עבר כתובת</title>
<meta http-equiv="refresh" content="2; url=https://shai-pilates.github.io/">
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #eef0ea; color: #1f2a26; font-family: system-ui, sans-serif; text-align: center; padding: 16px; box-sizing: border-box }
  a { display: inline-block; margin-top: 12px; padding: 12px 22px; border-radius: 12px; background: #3f6f5e; color: #fff; text-decoration: none; font-weight: 600 }
</style>
</head>
<body>
<main>
  <h1>הסטודיו של שי עבר לכתובת חדשה</h1>
  <p>עוד רגע עוברים לשם לבד.</p>
  <a href="https://shai-pilates.github.io/">לכתובת החדשה</a>
</main>
<script>
  // Remove only Shai's old service worker (scope /shai-studio/). Saved data is left untouched.
  try { navigator.serviceWorker && navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => { if (/\/shai-studio\/$/.test(r.scope)) r.unregister(); })); } catch (e) {}
  setTimeout(() => location.replace("https://shai-pilates.github.io/"), 600);
</script>
</body>
</html>
